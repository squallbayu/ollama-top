name: Public Release Builder

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish macOS Universal Release
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Version
        id: meta
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VER="${{ github.event.inputs.version }}"
            TAG="v${VER#v}"
          else
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Universal macOS Bundle & CLI Archives
        run: |
          chmod +x scripts/build.sh cli/ollama-top
          ./scripts/build.sh --universal --package --version "${{ steps.meta.outputs.version }}"

      - name: Verify Signatures & Checksums
        run: |
          lipo -info dist/OllamaTop.app/Contents/MacOS/OllamaTop
          codesign --verify --deep --strict dist/OllamaTop.app
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "OllamaTop ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist/OllamaTop-v${{ steps.meta.outputs.version }}-macos-universal.zip
            dist/ollama-top-cli-v${{ steps.meta.outputs.version }}.tar.gz
            dist/ollama-top
            dist/SHA256SUMS.txt
